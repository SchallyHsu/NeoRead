<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>论文聊天</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          17px/1.65 system-ui,
          sans-serif;
      }
      body {
        margin: auto;
        max-width: 48rem;
        padding: 1.2rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      button,
      input {
        font: inherit;
        color: inherit;
        background: Canvas;
        border: 1px solid GrayText;
        border-radius: 0.4rem;
        padding: 0.4rem 0.6rem;
      }
      input {
        box-sizing: border-box;
        width: 100%;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        padding: 0.6rem 0;
        border-bottom: 1px solid GrayText;
      }
      li button {
        width: 100%;
        border: 0;
        text-align: left;
      }
      small {
        display: block;
        opacity: 0.7;
      }
      article {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin-bottom: 1.5rem;
      }
      article strong {
        display: block;
        font-size: 0.9rem;
      }
      #back {
        margin-bottom: 0.6rem;
      }
    </style>
  </head>
  <body>
    <button hidden id="back">返回聊天列表</button>
    <h1 id="heading">论文聊天</h1>
    <input
      type="search"
      id="search"
      aria-label="搜索论文或聊天"
      placeholder="搜索论文或聊天"
    />
    <p id="status" role="status">正在读取 WebDAV…</p>
    <main id="main"></main>
    <script>
      const el = (id) => document.getElementById(id),
        main = el("main"),
        search = el("search"),
        back = el("back"),
        heading = el("heading"),
        statusLine = el("status");
      let chats = [];
      function node(tag, text) {
        const n = document.createElement(tag);
        n.textContent = text;
        return n;
      }
      function list() {
        const q = search.value.trim().toLocaleLowerCase();
        main.replaceChildren();
        heading.textContent = "论文聊天";
        back.hidden = true;
        search.hidden = false;
        const items = chats.filter((c) =>
          (c.session.title + " " + (c.session.paper?.title || ""))
            .toLocaleLowerCase()
            .includes(q),
        );
        statusLine.textContent = items.length + " 个会话";
        const ul = node("ul", "");
        for (const c of items) {
          const li = node("li", ""),
            button = node("button", c.session.title || "未命名会话");
          button.append(
            node("small", c.session.paper?.title || c.session.backend),
          );
          button.onclick = () => show(c);
          li.append(button);
          ul.append(li);
        }
        main.append(ul);
      }
      function show(c) {
        back.hidden = false;
        search.hidden = true;
        heading.textContent = c.session.title;
        statusLine.textContent = c.session.paper?.title || "";
        main.replaceChildren();
        const replies = new Map();
        for (const { event: e } of c.events) {
          if (e.t === "user") {
            const n = node("article", "");
            n.append(
              node("strong", "你"),
              document.createTextNode(e.text || ""),
            );
            main.append(n);
          }
          if (e.t === "text") {
            let target = replies.get(e.turn);
            if (!target) {
              const n = node("article", "");
              target = document.createTextNode("");
              n.append(node("strong", "助手"), target);
              replies.set(e.turn, target);
              main.append(n);
            }
            target.appendData(e.delta || "");
          }
        }
        scrollTo(0, 0);
      }
      back.onclick = list;
      search.oninput = list;
      (async () => {
        try {
          const r = await fetch("./v1.json", {
            credentials: "same-origin",
            redirect: "error",
            cache: "no-store",
          });
          if (!r.ok) throw Error(String(r.status));
          const v = await r.json();
          if (v.format !== "zotero-agent-chat" || v.version !== 1)
            throw Error("格式");
          chats = Object.values(v.chats)
            .filter((c) => !c.deleted)
            .sort((a, b) => b.session.updatedAt - a.session.updatedAt);
          list();
        } catch (e) {
          statusLine.textContent =
            "无法读取聊天，请确认已连接家中网络或 VPN，并使用 WebDAV 账号登录。";
        }
      })();
    </script>
  </body>
</html>
